<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InspiraDo</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://inspirado.app/" />
  <!-- Clean branded short link: inspirado.app/instagram
       iPhone  -> App Store (ct=instagram-bio campaign tag)
       others  -> web app with UTM attribution (iPad too: there's no iPad version yet)
       no JS   -> web app via the meta refresh below -->
  <noscript><meta http-equiv="refresh" content="0; url=https://app.inspirado.app/?utm_source=instagram&utm_medium=social&utm_campaign=bio" /></noscript>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    html,body{height:100%;margin:0}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#F3F1ED;color:#1A1917;display:grid;place-items:center;text-align:center;padding:0 24px}
    .m{opacity:.7;font-size:15px;letter-spacing:.3px;margin:0 0 18px}
    .links a{display:block;margin:10px 0;color:#1A1917;font-size:16px}
  </style>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var iPhone = /iPhone|iPod/.test(ua);
      location.replace(iPhone ? "https://apps.apple.com/app/id6826492571?ct=instagram-bio&mt=8" : "https://app.inspirado.app/?utm_source=instagram&utm_medium=social&utm_campaign=bio");
    })();
  </script>
</head>
<body>
  <div>
    <p class="m">Taking you to InspiraDo…</p>
    <div class="links">
      <a href="https://apps.apple.com/app/id6826492571?ct=instagram-bio&mt=8">Get it on the App Store (iPhone)</a>
      <a href="https://app.inspirado.app/?utm_source=instagram&utm_medium=social&utm_campaign=bio">Use it in your browser</a>
    </div>
  </div>
</body>
</html>
